name: Glucocalc
options:
  bundleIdPrefix: com.jocala
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "17.0"
settings:
  TARGETED_DEVICE_FAMILY: "1,2"
  DEVELOPMENT_TEAM: 9Q77WK7W3R

targets:
  Glucocalc:
    type: application
    platform: iOS
    sources:
      - path: Glucocalc/
    info:
      path: Glucocalc/Info.plist
      properties:
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jocala.glucocalc
      INFOPLIST_KEY_CFBundleDisplayName: Glucocalc
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic

  GlucocalcMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Glucocalc/
    info:
      path: mac/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.medical
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jocala.glucocalc
      PRODUCT_NAME: Glucocalc
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
